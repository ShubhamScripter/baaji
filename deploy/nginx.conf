upstream baaji_backend {
    server 127.0.0.1:3000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name baajihub.com ag.baajihub.com;
    return 301 https://$host$request_uri;
}

# Main site: baajihub.com
server {
    listen 443 ssl http2;
    server_name baajihub.com;

    ssl_certificate /etc/letsencrypt/live/baajihub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baajihub.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://baaji_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

# Admin panel: ag.baajihub.com
server {
    listen 443 ssl http2;
    server_name ag.baajihub.com;

    ssl_certificate /etc/letsencrypt/live/ag.baajihub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ag.baajihub.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://baaji_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
